name: Lighthouse (advisory)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Production dashboard audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.32'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - run: npm install --global npm@11.6.4
      - run: npm --prefix apps/web ci
      - run: uv sync --locked --project apps/server --extra api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Audit real production build with an empty isolated API
        run: npm run lighthouse
        working-directory: apps/web
      - name: Retain score evidence and audited-state metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: apps/web/lighthouse-reports/
          if-no-files-found: warn
          retention-days: 14
