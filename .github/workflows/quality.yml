name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.32'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - run: uv sync --locked --project apps/server --extra dev
      - run: uv run --locked --project apps/server ruff check .
      - run: uv run --locked --project apps/server ruff format --check .
      - run: uv run --locked --project apps/server pyright --project pyrightconfig.json

  backend-tests:
    name: Backend Tests (${{ matrix.os == 'ubuntu-latest' && 'Ubuntu' || 'Windows' }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.32'
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - run: uv sync --locked --project apps/server --extra dev
      - run: uv run --locked --project apps/server pytest apps/server/tests -q -m "not spawn"
      - name: Exercise real spawn workers, benchmarks, and failure cleanup
        run: uv run --locked --project apps/server pytest apps/server/tests -q -m spawn
      - name: Build and smoke wheel and sdist outside the repository
        shell: bash
        run: |
          uv build --project apps/server --python '${{ matrix.python }}' --out-dir "$RUNNER_TEMP/dist"
          uv export --locked --project apps/server --extra api --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/constraints.txt"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_path=Scripts/python.exe
          else
            python_path=bin/python
          fi
          for artifact in "$RUNNER_TEMP"/dist/*; do
            environment="$RUNNER_TEMP/install-$(basename "$artifact")"
            uv venv --python '${{ matrix.python }}' "$environment"
            uv pip install --python "$environment/$python_path" --constraint "$RUNNER_TEMP/constraints.txt" "$artifact"
            (cd "$RUNNER_TEMP" && "$environment/$python_path" -I "$GITHUB_WORKSPACE/apps/server/tests/installed_package_probe.py")
            uv pip install --python "$environment/$python_path" --constraint "$RUNNER_TEMP/constraints.txt" "${artifact}[api]"
            (cd "$RUNNER_TEMP" && "$environment/$python_path" -I "$GITHUB_WORKSPACE/apps/server/tests/installed_package_probe.py" --api)
          done

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@11.6.4
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run bundle:check

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@11.6.4
      - run: npm ci
      - run: npm run test:coverage

  repository-text:
    name: Repository Text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.32'
          python-version: '3.11'
      - run: uv run --python 3.11 scripts/check_repository.py

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate GitHub Actions with actionlint 1.7.12
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

  docs-links:
    name: Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments=anchor-only README.md 'docs/**/*.md'
          output: .cache/lychee-local.md

  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs:
      - backend-quality
      - backend-tests
      - frontend-quality
      - frontend-tests
      - repository-text
      - workflow-lint
      - docs-links
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every prerequisite to succeed
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["REQUIRED_JOB_RESULTS"])
          failed = [name for name, job in results.items() if job.get("result") != "success"]
          if not results or failed:
              sys.exit("Required jobs did not succeed: " + ", ".join(failed))
          print("All required jobs succeeded")
          PY
