[build-system]
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"

[project]
name = "tachyron"
version = "0.1.0"
description = "Single-host parallel image-processing benchmarks."
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "pillow>=13,<14",
    "psutil>=7,<8",
]

[project.scripts]
tachyron-process = "tachyron.cli:main"
tachyron-benchmark = "tachyron.benchmark_cli:main"
tachyron-execute = "tachyron.execution.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "python-multipart==0.0.32"]
dev = [
    "tachyron[api]",
    "pyright>=1.1.400,<2",
    "pytest>=8,<10",
    "ruff>=0.16.3,<0.17",
    "httpx2>=2.16,<3",
    "types-psutil>=7,<8",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
addopts = "--strict-config --strict-markers"
markers = ["spawn: integration tests that create real spawn-context child processes"]
filterwarnings = ["error"]
