required-version = ">=0.16.3,<0.17"
cache-dir = ".cache/ruff"
extend-exclude = [".cache"]
line-length = 88
target-version = "py311"

[lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "CPY001",
    "DTZ",
    "E",
    "F",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PTH",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "RUF069",
    "S",
    "SIM",
    "T10",
    "T20",
    "TRY004",
    "TRY201",
    "TRY203",
    "TRY400",
    "TRY401",
    "UP",
    "W",
]
ignore = ["E501"]
preview = true
explicit-preview-rules = true

[lint.flake8-copyright]
author = "Hans Valerie"

[lint.mccabe]
max-complexity = 15

[lint.isort]
known-first-party = ["tachyron", "tests"]

[lint.per-file-ignores]
# Test code may require plain assertions and unused fixtures/callback parameters.
"**/tests/**/*.py" = ["S101", "ARG001", "ARG002", "ARG005"]

[format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
